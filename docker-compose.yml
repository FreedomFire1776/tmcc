services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tmcc
      POSTGRES_PASSWORD: tmcc
      POSTGRES_DB: tmcc
    ports:
      - "5432:5432"
    volumes:
      - tmcc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmcc -d tmcc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tmcc_postgres:
